<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Point · Right to the point</title>
<meta name="description" content="Point finds the most sustainable product on the shelf, and shows you where it is. Clickable prototype.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root { --bg: #01031A; --fg: #FFFFFF; --dim: rgba(255,255,255,.5); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: radial-gradient(ellipse at 50% 45%, #0B1550 0%, var(--bg) 60%); color: var(--fg); font: 300 15px/1.4 "Jost", Futura, sans-serif; overflow: hidden; }
  .top { position: fixed; top: 28px; left: 36px; right: 36px; display: flex; justify-content: space-between; align-items: center; z-index: 3; }
  .mark { display: flex; align-items: center; gap: 12px; letter-spacing: .5em; font-size: 14px; }
  .mark i { width: 18px; height: 18px; border-radius: 50%; background: conic-gradient(from 90deg, #6E5BFF, #1F6BFF, #8FD8FF, #6E5BFF); -webkit-mask: radial-gradient(circle, transparent 52%, #000 55%); mask: radial-gradient(circle, transparent 52%, #000 55%); }
  .top a { color: var(--dim); text-decoration: none; letter-spacing: .2em; font-size: 12px; text-transform: uppercase; }
  .top a:hover { color: #fff; }
  .side { position: fixed; left: 36px; bottom: 34px; max-width: 300px; z-index: 3; }
  .side h1 { font-weight: 300; font-size: 30px; letter-spacing: .2em; text-transform: uppercase; line-height: 1.2; margin: 0 0 12px; }
  .side p { color: var(--dim); margin: 0; }
  .foot { position: fixed; right: 36px; bottom: 34px; color: var(--dim); font-size: 11px; letter-spacing: .12em; text-align: right; z-index: 3; }
  .foot a { color: var(--dim); }

  .stage { height: 100%; display: grid; place-items: center; }
  .scaler { width: 430px; height: 884px; transform-origin: center; }
  .iphone { position: relative; width: 430px; height: 884px; border-radius: 68px; padding: 18px;
    background: linear-gradient(145deg, #3A3D45, #15161A 40%, #2B2D33 70%, #0E0F12);
    box-shadow: 0 0 0 1.5px #55585F inset, 0 0 0 7px #0A0A0C inset, 0 50px 120px rgba(0,0,0,.6), 0 0 90px rgba(60,80,255,.12); }
  .iphone::before, .iphone::after { content: ""; position: absolute; width: 4px; border-radius: 2px; background: #2A2C31; }
  .iphone::before { left: -4px; top: 190px; height: 64px; box-shadow: 0 90px 0 #2A2C31; }
  .iphone::after { right: -4px; top: 250px; height: 100px; }
  .screen { position: relative; width: 100%; height: 100%; border-radius: 52px; overflow: hidden; background: #03072B; }
  .island { position: absolute; top: 13px; left: 50%; transform: translateX(-50%); width: 120px; height: 34px; border-radius: 20px; background: #000; z-index: 2; pointer-events: none; }
  .status { position: absolute; top: 18px; left: 34px; right: 30px; display: flex; justify-content: space-between; font: 500 15px -apple-system, "SF Pro Text", sans-serif; z-index: 2; pointer-events: none; }
  .status span:last-child { letter-spacing: 2px; font-size: 12px; }
  iframe { width: 100%; height: 100%; border: 0; display: block; }

  @media (max-width: 900px) { .side, .foot { display: none; } }
  @media (max-width: 520px) {
    body { overflow: auto; }
    .top { display: none; }
    .scaler { width: 100vw; height: 100dvh; transform: none !important; }
    .iphone { width: 100%; height: 100%; border-radius: 0; padding: 0; box-shadow: none; background: none; }
    .iphone::before, .iphone::after, .island, .status { display: none; }
    .screen { border-radius: 0; }
  }
</style>
</head>
<body>
  <div class="top">
    <div class="mark"><i></i>POINT</div>
    <div style="display:flex;gap:28px"><a href="#" id="play">▶ Play demo</a><a href="app.html">Open full screen</a></div>
  </div>

  <div class="stage">
    <div class="scaler" id="scaler">
      <div class="iphone">
        <div class="screen">
          <div class="island"></div>
          <div class="status"><span id="clock">9:41</span><span>●●● ▮</span></div>
          <iframe src="app.html?embed" title="Point app"></iframe>
        </div>
      </div>
    </div>
  </div>

  <div class="side">
    <h1>Right to<br>the point.</h1>
    <p>Pick a goal. Write your list. Point finds the most sustainable product on the shelf, and shows you where it is.</p>
  </div>
  <div class="foot">Prototype · HSG Fintech 2026 · Illustrative data<br>Photos: Wikimedia Commons (<a href="https://github.com/steinerchristof/point-prototype/blob/main/CREDITS.md">credits</a>) · Map: © OpenStreetMap contributors</div>

<script>
  function fit() {
    const s = document.getElementById("scaler");
    if (innerWidth <= 520) { s.style.transform = ""; return; }
    s.style.transform = `scale(${Math.min(1, (innerHeight - 60) / 884, (innerWidth - 40) / 430)})`;
  }
  addEventListener("resize", fit); fit();
  const frame = document.querySelector("iframe");
  const play = () => frame.contentWindow.postMessage("demo", "*");
  document.getElementById("play").addEventListener("click", (e) => { e.preventDefault(); play(); });
  addEventListener("keydown", (e) => { if (e.key === "d" || e.key === "D") play(); });
  if (location.hash === "#demo") frame.addEventListener("load", () => setTimeout(play, 600));
  const d = new Date(); document.getElementById("clock").textContent = d.getHours() + ":" + String(d.getMinutes()).padStart(2, "0");
</script>
</body>
</html>
