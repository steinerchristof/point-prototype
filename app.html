<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F8FC">
<title>Point App</title>
<meta name="description" content="Point app prototype: write your shopping list as always. Point puts the best-scoring verified product under every word and shows you where it is in the shop.">
<script>
  // On a desktop the app is always shown inside the iPhone frame (index.html).
  if (/embed/.test(location.search)) {
    document.documentElement.classList.add("embed");
    const bareCheck = () => { try { document.documentElement.classList.toggle("bare", parent.matchMedia(parent.BARE_Q).matches); } catch (e) {} };
    bareCheck(); try { parent.addEventListener("resize", bareCheck); } catch (e) {}
  }
  else if (window.innerWidth >= 700) location.replace("index.html" + location.hash);
  else document.documentElement.classList.add("bare");
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root {
    --paper: #F6F8FC; --card: #FFFFFF; --ink: #0B1220; --ink2: #3F4A5C; --ink3: #5F6B7E; --line: #E3E8F0;
    --blue: #1F6BFF; --blue-soft: #E8F0FF; --violet: #7B5CFF; --cyan: #5CC8F0; --mid: #060B24;
    --iris: conic-gradient(from 210deg, #1F6BFF, #7B5CFF, #5CC8F0, #1F6BFF);
    --pad: 20px; --top: env(safe-area-inset-top, 0px); --bot: env(safe-area-inset-bottom, 0px);
  }
  html.embed:not(.bare) { --top: 54px; --bot: 18px; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--paper); overflow: hidden; }
  body { position: relative; overflow: clip; } /* nothing can scroll the page sideways */
  body { color: var(--ink); font: 400 15px/1.4 "DM Sans", -apple-system, "Segoe UI", sans-serif; overflow: hidden; -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  input { font: inherit; color: inherit; }

  .screen { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; padding: calc(var(--top) + 8px) var(--pad) calc(var(--bot) + 24px); background: var(--paper); opacity: 0; pointer-events: none; transition: opacity 0s linear .32s; z-index: 1; scrollbar-width: none; }
  .screen::-webkit-scrollbar { display: none; }
  /* keeps scrolled content out from under the status bar */
  body::before { content: ""; position: fixed; top: 0; left: 0; right: 0; height: var(--top); background: var(--paper); z-index: 15; pointer-events: none; }
  .screen.on { opacity: 1; pointer-events: auto; z-index: 2; transition: none; animation: enter .32s cubic-bezier(.2,.8,.2,1); }
  @keyframes enter { from { opacity: 0; transform: translateX(24px); } }

  /* nav */
  .nav { display: flex; justify-content: space-between; align-items: center; min-height: 36px; }
  .navbtn { color: var(--blue); font-size: 16px; font-weight: 500; display: inline-flex; align-items: center; gap: 2px; padding: 6px 0; }
  .navbtn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  h1 { font-size: 30px; line-height: 1.15; font-weight: 700; letter-spacing: -.01em; margin: 6px 0 10px; }
  .meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 6px; }
  .pill { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: 15px; background: var(--card); border: 1px solid var(--line); font-size: 13px; font-weight: 600; white-space: nowrap; }
  .pill svg { width: 13px; height: 13px; fill: var(--blue); flex: none; }
  .pill .car { width: 10px; height: 10px; fill: none; stroke: var(--ink2); stroke-width: 2.2; }
  .chip { display: inline-flex; align-items: center; height: 30px; padding: 0 12px; border-radius: 15px; background: var(--blue-soft); color: var(--blue); font-size: 13px; font-weight: 600; white-space: nowrap; }

  /* ring: the brand mark and the status of every word */
  .ring { width: 18px; height: 18px; border-radius: 50%; flex: none; background: var(--iris); -webkit-mask: radial-gradient(circle, transparent 32%, #000 36%); mask: radial-gradient(circle, transparent 32%, #000 36%); transition: opacity .3s; }
  .ring.looking { opacity: .35; animation: pulse 1s ease-in-out infinite; }
  .ring.none { background: #C9D0DB; }
  .ring.empty { opacity: 0; }
  @keyframes pulse { 50% { opacity: .12; } }
  .wm { display: inline-flex; align-items: baseline; font-weight: 700; letter-spacing: -.02em; }
  .wm i { display: inline-block; width: .62em; height: .62em; margin: 0 .03em; border-radius: 50%; background: var(--iris); -webkit-mask: radial-gradient(circle, transparent 30%, #000 34%); mask: radial-gradient(circle, transparent 30%, #000 34%); }

  /* lists */
  .search { display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 12px; border-radius: 11px; background: #E9EDF4; margin: 4px 0 18px; color: var(--ink3); }
  .search svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; flex: none; }
  .search input { border: 0; outline: 0; background: none; flex: 1; min-width: 0; font-size: 15px; color: var(--ink); }
  .search input::placeholder { color: var(--ink3); }
  .sec { font-size: 17px; font-weight: 700; margin: 6px 0 8px; }
  .group { background: var(--card); border-radius: 14px; overflow: hidden; margin-bottom: 20px; box-shadow: 0 1px 2px rgba(11,18,32,.04); }
  .lrow { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 12px 14px; border-bottom: 1px solid var(--line); }
  .lrow:last-child { border-bottom: 0; }
  .lrow > div { flex: 1; min-width: 0; }
  .lrow b { display: block; font-size: 15px; font-weight: 600; }
  .lrow small { display: block; font-size: 13px; color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lrow .st { display: flex; align-items: center; gap: 6px; margin-top: 3px; font-size: 12.5px; font-weight: 600; color: var(--blue); }
  .lrow .st.grey { color: var(--ink3); font-weight: 500; }
  .lrow .st .ring { width: 13px; height: 13px; }
  .chev { width: 14px; height: 14px; stroke: #A9B2C1; fill: none; stroke-width: 2.4; flex: none; }
  .toolbar { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px var(--pad) calc(var(--bot) + 10px); display: flex; justify-content: space-between; align-items: center; background: rgba(246,248,252,.92); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-top: 1px solid var(--line); font-size: 12.5px; color: var(--ink3); z-index: 5; }
  .toolbar button { width: 40px; height: 40px; display: grid; place-items: center; color: var(--blue); margin: -3px -8px -3px 0; }
  .toolbar svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .hint { font-size: 13px; color: var(--ink3); text-align: center; margin: 4px 0 80px; line-height: 1.5; }

  /* note: write mode */
  .date { text-align: center; font-size: 12.5px; color: var(--ink3); margin: 2px 0 8px; }
  .title-in { width: 100%; border: 0; outline: 0; background: none; font-size: 26px; font-weight: 700; padding: 4px 0 8px; }
  .title-in::placeholder { color: #B5BDCA; }
  .line { display: flex; align-items: center; gap: 10px; min-height: 42px; }
  .line input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; font-size: 18px; padding: 7px 0; }
  .line input::placeholder { color: #B5BDCA; }
  .whint { font-size: 13px; color: var(--ink3); margin-top: 16px; line-height: 1.5; }

  /* note: done mode */
  .items { border-top: 1px solid var(--line); margin-top: 8px; padding-bottom: 12px; }
  .item { border-bottom: 1px solid var(--line); transition: opacity .25s; }
  .item.faded > .ihead { opacity: .4; }
  .ihead { display: block; width: 100%; text-align: left; padding: 12px 0; }
  .irow { display: flex; align-items: center; gap: 10px; }
  .word { flex: 1; min-width: 0; font-size: 19px; font-weight: 600; letter-spacing: -.005em; overflow-wrap: anywhere; }
  .badge { display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 8px 0 6px; border-radius: 12px; background: var(--blue-soft); color: var(--blue); font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; flex: none; }
  .badge .ring { width: 13px; height: 13px; }
  .pickl { font-size: 13.5px; color: var(--ink2); margin-top: 2px; }
  .place { font-size: 12.5px; color: var(--ink3); margin-top: 1px; }
  .elsewhere { display: inline-flex; align-items: center; gap: 6px; margin-top: 9px; min-height: 32px; padding: 4px 12px; border-radius: 16px; background: var(--blue-soft); color: var(--blue); font-size: 13px; font-weight: 600; }
  .elsewhere svg { width: 13px; height: 13px; fill: currentColor; flex: none; }

  .card { background: var(--card); border-radius: 16px; padding: 14px; margin: 0 0 14px; box-shadow: 0 6px 24px rgba(11,18,32,.08); animation: pop .35s ease; }
  @keyframes pop { from { opacity: 0; transform: translateY(-6px); } }
  .prod { display: flex; gap: 12px; align-items: center; }
  .thumb { width: 64px; height: 64px; border-radius: 12px; object-fit: cover; flex: none; background: #EEF1F6; }
  .ph { width: 64px; height: 64px; border-radius: 12px; flex: none; background: #EEF1F6; display: grid; place-items: center; font-size: 10px; letter-spacing: .08em; color: var(--ink3); text-align: center; line-height: 1.3; }
  .prod .tx { flex: 1; min-width: 0; }
  .brand { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--blue); font-weight: 700; }
  .pname { font-size: 16px; font-weight: 700; line-height: 1.2; margin: 2px 0; }
  .pmeta { font-size: 12.5px; color: var(--ink2); }
  .sring { position: relative; width: 58px; height: 58px; flex: none; }
  .sring svg { width: 100%; height: 100%; transform: rotate(-90deg); display: block; }
  .sring b { position: absolute; inset: 0; display: grid; place-items: center; font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .ver { display: block; text-align: center; font-size: 11px; color: var(--ink3); margin-top: 3px; }
  .loc { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 13.5px; font-weight: 600; margin: 14px 0 8px; }
  .loc svg { width: 14px; height: 14px; fill: var(--blue); flex: none; }
  .plan { background: #F2F5FA; border-radius: 12px; padding: 6px; }
  .plan svg { width: 100%; height: auto; display: block; }
  .twobtn { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
  .btn { min-height: 42px; border-radius: 11px; font-size: 14px; font-weight: 600; display: grid; place-items: center; padding: 6px 10px; text-align: center; line-height: 1.2; }
  .btn.soft { background: var(--blue-soft); color: var(--blue); }
  .btn.dark { background: var(--mid); color: #fff; }
  .btn.primary { background: linear-gradient(100deg, #1F6BFF, #6A5CFF 60%, #4FB4F0); color: #fff; box-shadow: 0 8px 20px rgba(31,107,255,.3); }
  .go { position: sticky; bottom: 0; margin: 16px 0 0; padding: 14px 0 4px; background: linear-gradient(rgba(246,248,252,0), var(--paper) 35%); z-index: 2; }
  .go .btn { width: 100%; min-height: 52px; display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 0 18px; font-size: 15px; border-radius: 14px; }
  .go .btn span { font-weight: 500; opacity: .95; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .go .btn.center { justify-content: center; }
  .note { font-size: 11.5px; color: var(--ink3); text-align: center; margin: 10px 0 0; line-height: 1.45; }

  /* sheets */
  .scrim { position: fixed; inset: 0; background: rgba(6,11,36,.35); opacity: 0; pointer-events: none; transition: opacity .3s; z-index: 20; }
  .scrim.on { opacity: 1; pointer-events: auto; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; max-height: calc(100% - var(--top) - 16px); overflow-y: auto; background: var(--card); border-radius: 22px 22px 0 0; padding: 10px var(--pad) calc(var(--bot) + 20px); transform: translateY(105%); transition: transform .38s cubic-bezier(.2,.8,.2,1); z-index: 21; scrollbar-width: none; }
  .sheet::-webkit-scrollbar { display: none; }
  .sheet.on { transform: none; }
  .grab { width: 38px; height: 5px; border-radius: 3px; background: #D3D9E3; margin: 0 auto 10px; }
  .shead { display: flex; justify-content: space-between; align-items: center; gap: 10px; min-height: 34px; }
  .shead h2 { font-size: 19px; margin: 0; }
  .x { color: var(--blue); font-weight: 600; font-size: 15px; padding: 6px 0 6px 12px; }
  .sub { font-size: 13px; color: var(--ink2); margin: 2px 0 12px; line-height: 1.45; }
  .rankby { font-size: 12px; color: var(--ink3); width: 100%; margin-bottom: 2px; }
  .goals { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 10px; }
  .goal { height: 32px; padding: 0 12px; border-radius: 16px; border: 1px solid var(--line); font-size: 13px; font-weight: 600; color: var(--ink2); background: var(--card); transition: background .2s, color .2s, border-color .2s; }
  .goal.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .opt { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 10px 0; border-bottom: 1px solid var(--line); background: var(--card); position: relative; }
  .opt:last-child { border-bottom: 0; }
  .opt .thumb, .opt .ph { width: 48px; height: 48px; border-radius: 10px; font-size: 8.5px; }
  .opt .tx { flex: 1; min-width: 0; }
  .opt .tx b { display: block; font-size: 14.5px; font-weight: 600; }
  .opt .tx small { display: block; font-size: 12.5px; color: var(--ink2); }
  .opt .tx em { display: block; font-style: normal; font-size: 12px; color: var(--blue); font-weight: 600; margin-top: 2px; }
  .opt .num { font-size: 20px; font-weight: 700; min-width: 34px; text-align: right; font-variant-numeric: tabular-nums; }
  .opt.top .num { color: var(--blue); }
  .opt.unv { cursor: default; }
  .opt.unv .num { font-size: 12px; font-weight: 500; color: var(--ink3); width: 66px; line-height: 1.25; }
  .opt.unv .tx b, .opt.unv .tx small { color: var(--ink3); }

  /* proof sheet: midnight */
  .sheet.dark { background: radial-gradient(120% 70% at 20% 0%, #16245E 0%, #0A1236 45%, var(--mid) 100%); color: #fff; }
  .sheet.dark .grab { background: rgba(255,255,255,.3); }
  .sheet.dark .x { color: #A9C3FF; }
  .phero { display: flex; gap: 16px; align-items: center; margin: 2px 0 14px; }
  .phero .sring { width: 84px; height: 84px; }
  .phero .sring b { font-size: 26px; color: #fff; }
  .kick { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: #8FD8FF; font-weight: 700; }
  .phero > div:last-child { min-width: 0; }
  .phero h3 { font-size: 19px; margin: 3px 0 2px; line-height: 1.2; }
  .phero p { margin: 0; font-size: 13px; color: rgba(255,255,255,.78); }
  .lab { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: rgba(255,255,255,.72); font-weight: 700; margin: 16px 0 4px; }
  .why { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,.1); font-size: 13.5px; }
  .why span:first-child { color: rgba(255,255,255,.72); flex: none; }
  .why span:last-child { text-align: right; }
  .dimrow { display: grid; grid-template-columns: 84px 1fr 28px; align-items: center; gap: 10px; padding: 5px 0; font-size: 13.5px; }
  .dimrow span:first-child { color: rgba(255,255,255,.78); }
  .dimrow .bar { height: 6px; border-radius: 3px; background: rgba(255,255,255,.12); overflow: hidden; }
  .dimrow .bar i { display: block; height: 100%; width: 0; border-radius: 3px; background: linear-gradient(90deg, #1F6BFF, #7B5CFF); transition: width .9s cubic-bezier(.2,.8,.2,1); }
  .dimrow b { text-align: right; font-variant-numeric: tabular-nums; }
  .chk { display: flex; align-items: center; gap: 10px; padding: 8px 0; font-size: 13.5px; opacity: .3; transition: opacity .35s; }
  .chk.ok { opacity: 1; }
  .chk i { width: 20px; height: 20px; border-radius: 50%; background: rgba(255,255,255,.15); display: grid; place-items: center; flex: none; transition: background .3s; }
  .chk.ok i { background: var(--blue); }
  .chk i svg { width: 12px; height: 12px; stroke: #fff; fill: none; stroke-width: 3; opacity: 0; transition: opacity .3s; }
  .chk.ok i svg { opacity: 1; }
  .chk b { font-weight: 600; flex: 1; }
  .chk small { color: rgba(255,255,255,.75); font-size: 12px; text-align: right; }
  .pnote { font-size: 12.5px; color: rgba(255,255,255,.78); margin: 10px 0 0; line-height: 1.5; }
  .sim { display: inline-block; margin-top: 12px; font-size: 11.5px; color: rgba(255,255,255,.88); border: 1px solid rgba(255,255,255,.3); border-radius: 10px; padding: 3px 9px; }

  /* shops map */
  #map { touch-action: pan-y; }
  #map { height: 290px; border-radius: 14px; overflow: hidden; margin: 6px 0 10px; background: #E8ECF2; z-index: 0; }
  .leaflet-container { font-family: inherit; }
  .leaflet-tooltip.tag { background: var(--card); border: 0; border-radius: 9px; box-shadow: 0 2px 10px rgba(11,18,32,.18); color: var(--ink); font: 600 12px/1.25 "DM Sans", sans-serif; padding: 4px 8px; }
  .leaflet-tooltip.tag small { display: block; font-weight: 500; color: var(--ink2); font-size: 11px; }
  .leaflet-tooltip.tag::before { display: none; }
  .leaflet-tooltip.tag.cur { background: var(--blue); color: #fff; }
  .leaflet-tooltip.tag.cur small { color: rgba(255,255,255,.88); }
  .leaflet-tooltip.tag.me { background: var(--ink); color: #fff; }
  .srow { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 11px 0; border-bottom: 1px solid var(--line); }
  .srow .tx { flex: 1; min-width: 0; }
  .srow b { display: block; font-size: 15px; }
  .srow small { display: block; font-size: 12.5px; color: var(--ink2); }
  .srow .cnt { text-align: right; font-size: 13.5px; font-weight: 700; color: var(--blue); white-space: nowrap; }
  .srow .cnt small { color: var(--ink3); font-weight: 500; }
  .srow .you { color: var(--blue); font-weight: 600; font-size: 12.5px; }
  .srow.full .cnt { color: var(--violet); }

  /* in the shop */
  .next { display: flex; align-items: center; gap: 6px; font-size: 14px; margin: 10px 0 2px; flex-wrap: wrap; }
  .next svg { width: 14px; height: 14px; fill: var(--blue); flex: none; }
  .next b { font-weight: 700; }
  .gtitle { font-size: 11.5px; letter-spacing: .12em; text-transform: uppercase; font-weight: 700; color: var(--ink3); margin: 16px 0 2px; }
  .ihead, .tick, .card .btn, .elsewhere { scroll-margin: 70px 0 100px; }
  .tick { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 10px 0; border-bottom: 1px solid var(--line); transition: opacity .35s; }
  .tick .c { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--blue); display: grid; place-items: center; flex: none; transition: background .2s; }
  .tick .c svg { width: 13px; height: 13px; stroke: #fff; fill: none; stroke-width: 3; opacity: 0; }
  .tick.on .c { background: var(--blue); }
  .tick.on .c svg { opacity: 1; }
  .tick.on { opacity: .45; }
  .tick.on b { text-decoration: line-through; }
  .tick .tx { flex: 1; min-width: 0; }
  .tick b { display: block; font-size: 16px; font-weight: 600; }
  .tick small { display: block; font-size: 12.5px; color: var(--ink2); }
  .tick.free .c { border-color: #B5BDCA; }
  .tick.free.on .c { background: #B5BDCA; }

  /* done */
  .big { display: grid; place-items: center; margin: 12px 0 4px; text-align: center; }
  .big .sring { width: 160px; height: 160px; }
  .big .sring b { font-size: 46px; }
  .big p { margin: 8px 0 0; font-weight: 600; }
  .gain { display: table; margin: 8px auto 14px; background: var(--blue-soft); color: var(--blue); font-weight: 600; font-size: 13px; padding: 5px 12px; border-radius: 14px; }
  .three { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--card); border-radius: 14px; padding: 12px 4px; text-align: center; margin-bottom: 10px; }
  .three b { display: block; font-size: 17px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .three small { font-size: 11.5px; color: var(--ink3); }
  .drow { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
  .drow .tx { flex: 1; min-width: 0; }
  .drow small { display: block; font-size: 12px; color: var(--ink2); }
  .drow .yc { font-size: 12px; color: var(--ink3); }
  .drow .ok { width: 18px; color: var(--blue); font-weight: 700; }
  .drow .ok.grey { color: #A9B2C1; }

  /* demo */
  .tap { position: fixed; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%; background: rgba(31,107,255,.22); border: 2px solid rgba(31,107,255,.75); pointer-events: none; opacity: 0; transition: left .45s cubic-bezier(.3,.7,.2,1), top .45s cubic-bezier(.3,.7,.2,1), opacity .25s; z-index: 50; }
  .tap.down { animation: tapdown .35s ease; }
  @keyframes tapdown { 50% { transform: scale(.72); background: rgba(31,107,255,.42); } }

// ===================== 1 · Lists =====================
function renderLists() {

  const row = (l) => {

    const stat = l.shopped ? `<span class="st grey">Shopped · ${n} items</span>` : n === 0 ? `<span class="st grey"><i class="ring looking"></i>Writing…</span>` : `<span class="st"><i class="ring"></i>${f} of ${n} found</span>`;
    return `<button class="lrow" data-list="${l.id}"><div><b>${esc(l.t || "New list")}</b><small>${l.when} ${esc(words(l).join(", "))}</small>${stat}</div>${chev}</button>`;
  };

$("lq").addEventListener("input", renderLists);
function openList(id, mode) {

}
$("compose").onclick = () => newList();
function newList() {

// ===================== 2 · Note =====================

function renderWrite(l) {

function lineHTML(w, i) {

}
function ringState(w) { if (!w.trim()) return "empty"; return resolve(w, st.cur).state === "ready" ? "" : "none"; }

function itemHTML(r, i) {

      <div><div class="sring">${sring(s, 58)}</div><span class="ver">Verified</span></div></div>

function toggleItem(i) {

// ===================== Sheets =====================
function openSheet(id) { $("scrim").classList.add("on"); $(id).classList.add("on"); $(id).scrollTop = 0; }
function closeSheets() { $("scrim").classList.remove("on"); document.querySelectorAll(".sheet").forEach((s) => s.classList.remove("on")); }
let oCat = null;
function openOthers(cat) {
  oCat = cat; st.goal = "all";
  $("oTitle").textContent = "Other " + cat;
  $("oSub").textContent = `Everything on this shelf in ${shop().n} (illustrative). Tap one to make it your pick.`;
  $("oGoals").innerHTML = `<span class="rankby">Rank by</span>` + GOALS.map(([k, t]) => `<button class="goal${k === st.goal ? " on" : ""}" data-goal="${k}">${t}</button>`).join("");
  document.querySelectorAll("[data-goal]").forEach((b) => (b.onclick = () => setGoal(b.dataset.goal)));

}
function renderOthers(animate) {
  const box = $("oList"), before = {};

  const cur = resolve(cat2word(oCat), st.cur).pick;
  const list = ranked(oCat, st.goal);
  const label = GOALS.find(([k]) => k === st.goal)[1];
  box.innerHTML = list.map((p, i) => {
    const v = score(p, st.goal);
    if (v === null) return `<div class="opt unv" data-n="${esc(p.n)}">${img(p)}<div class="tx"><b>${esc(p.b)} · ${esc(p.n)}</b><small>${p.pk} · ${chf(p.pr)}</small></div><span class="num">No verified score</span></div>`;
    return `<button class="opt${i === 0 ? " top" : ""}" data-n="${esc(p.n)}" aria-label="${esc(p.b + " " + p.n + ", " + label + " " + v)}">${img(p)}<div class="tx"><b>${esc(p.b)} · ${esc(p.n)}</b><small>${p.pk} · ${chf(p.pr)}</small>${cur && cur.n === p.n ? "<em>✓ Your pick</em>" : ""}</div><span class="num">${v}</span></button>`;
  }).join("");
  box.querySelectorAll("button.opt").forEach((b) => (b.onclick = () => choose(b.dataset.n)));
  if (animate) box.querySelectorAll(".opt").forEach((el) => {
    const dy = (before[el.dataset.n] ?? 0) - el.getBoundingClientRect().top; if (!dy) return;

  });
}
function cat2word(cat) { const l = curList(); return (l && words(l).find((w) => catOf(w) === cat)) || cat; }
function setGoal(g) { st.goal = g; document.querySelectorAll("[data-goal]").forEach((b) => b.classList.toggle("on", b.dataset.goal === g)); renderOthers(true); }

  const best = ranked(oCat, "all").find((p) => p.d);
  if (best && best.n === n) delete st.pick[st.cur + ":" + oCat]; else st.pick[st.cur + ":" + oCat] = n;
  renderOthers(false); setTimeout(() => { closeSheets(); renderNote(); }, 400);
}
let proofTok = 0;
function openProof(cat) {
  const r = resolve(cat2word(cat), st.cur), p = r.pick, s = score(p);
  const next = ranked(cat).filter((x) => x.d && x !== p)[0];
  const kind = { pasta: "this pasta", oranges: "these oranges", apples: "these apples", milk: "this milk", coffee: "this coffee", tomatoes: "these tomatoes", "olive oil": "this oil" }[cat];
  $("proofBody").innerHTML = `<div class="phero"><div class="sring">${sring(s, 84, "rgba(255,255,255,.14)")}</div><div>
      <div class="kick">Why ${esc(kind)}</div><h3>${r.rank === 0 ? `Best of ${r.n} on this shelf` : `Number ${r.rank + 1} of ${r.n} on this shelf`}</h3>
      <p>${next ? `${r.rank === 0 ? "Next best" : "Best"}: ${score(next)} · ${esc(next.b)}` : "The only verified one here"}</p></div></div>
    <div class="lab">Why it scores</div>${p.why.map(([a, b]) => `<div class="why"><span>${a}</span><span>${b}</span></div>`).join("")}
    <div class="lab">Score by dimension</div>${DIMS.map(([k, t]) => `<div class="dimrow"><span>${t}</span><span class="bar"><i data-w="${p.d[k]}"></i></span><b>${p.d[k]}</b></div>`).join("")}
    <p class="pnote" style="margin-top:6px">Point score = average of the four dimensions, equal weights in this first version. The formula is open.</p>
    <div class="lab">Proof</div>

    <div class="chk"><i>${check}</i><b>Open formula</b><small>anyone can rerun it</small></div>
    <div class="chk"><i>${check}</i><b>Audited data</b><small>independent auditor, at the source</small></div>
    <div class="chk"><i>${check}</i><b>Zero-knowledge proof</b><small id="zkT">checking…</small></div>

  const tok = ++proofTok, later = (f, ms) => setTimeout(() => tok === proofTok && f(), ms);

  $("proofBody").querySelectorAll(".chk").forEach((c, i) => later(() => { c.classList.add("ok"); if (i === 2 && $("zkT")) $("zkT").textContent = "0.04 s, simulated"; }, 1000 + i * 600));

// ===================== 3 · Shops nearby =====================
let map, layer;
function km(a, b) { const R = 6371, t = Math.PI / 180, dl = (b[0] - a[0]) * t, dn = (b[1] - a[1]) * t; const h = Math.sin(dl / 2) ** 2 + Math.cos(a[0] * t) * Math.cos(b[0] * t) * Math.sin(dn / 2) ** 2; return 2 * R * Math.asin(Math.sqrt(h)); }
function basket(l, sid) { const ps = words(l).map((w) => resolve(w, l.id, sid)).filter((r) => r.state === "ready").map((r) => score(r.pick)); return ps.length ? Math.round(ps.reduce((a, b) => a + b, 0) / ps.length) : null; }
function renderShops() {
  const l = curList() || st.lists.find((x) => !x.shopped && words(x).length) || st.lists[0];
  const prev = hist[hist.length - 2];
  $("shopsBack").textContent = prev === "note" ? l.t : "Lists";
  const n = words(l).length;
  $("shopsSub").textContent = `How much of “${l.t}” each shop has with a verified score. Tap a shop, on the map or below, to switch.`;
  const rows = SHOPS.map((s) => ({ s, f: found(l, s.id), d: km(ME, s.ll), b: basket(l, s.id) })).sort((a, b) => b.f - a.f || a.d - b.d);
  $("shopRows").innerHTML = rows.map(({ s, f, d, b }) => `<button class="srow${f === n ? " full" : ""}" data-pick="${s.id}"><div class="tx"><b>${s.n}${s.id === st.shop ? ' <span class="you">· your shop</span>' : ""}</b><small>${s.a} · ${d.toFixed(1)} km</small></div><div class="cnt">${f} of ${n} found<small>basket ${b ?? "–"}</small></div></button>`).join("");
  document.querySelectorAll("[data-pick]").forEach((b) => (b.onclick = () => pickShop(b.dataset.pick)));
  setTimeout(() => drawMap(l), 80);
}
// Pick a shop from the list or the map: it becomes your shop, then back to the list.
let picking = false;
function pickShop(id) {
  if (picking) return; picking = true;
  st.shop = id; st.open = null; setShopNames(); renderShops();
  setTimeout(() => { picking = false; if ($("shops").classList.contains("on")) back(); }, 650);
}
function drawMap(l) {
  if (!window.L) { $("map").innerHTML = '<p class="note" style="padding:120px 20px">Map needs an internet connection.</p>'; return; }
  if (!map) {
    // fixed overview: no dragging, so a slightly moving finger still counts as a tap, and a swipe scrolls the page
    map = L.map("map", { zoomControl: false, attributionControl: true, scrollWheelZoom: false, dragging: false, touchZoom: false, doubleClickZoom: false, boxZoom: false, keyboard: false });
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "© OpenStreetMap contributors" }).addTo(map);
    layer = L.layerGroup().addTo(map);
    // labels: one listener on the map box (Leaflet may replace label elements). A tap = finger moved less than 14 px.
    const box = $("map"); let t0 = null;
    const idAt = (e) => { const el = e.target.closest && e.target.closest("[data-shopid]"); return el && el.dataset.shopid; };
    box.addEventListener("click", (e) => { const id = idAt(e); if (id) { e.stopPropagation(); pickShop(id); } }, true);
    box.addEventListener("touchstart", (e) => { const t = e.touches[0]; t0 = idAt(e) ? [t.clientX, t.clientY] : null; }, { passive: true, capture: true });
    box.addEventListener("touchend", (e) => { const id = idAt(e), t = e.changedTouches[0]; if (id && t0 && Math.hypot(t.clientX - t0[0], t.clientY - t0[1]) < 14) { e.preventDefault(); pickShop(id); } t0 = null; }, { capture: true });
  }
  map.invalidateSize(); layer.clearLayers();
  const n = words(l).length;
  L.circleMarker(ME, { radius: 7, color: "#fff", weight: 3, fillColor: "#0B1220", fillOpacity: 1 }).addTo(layer).bindTooltip("You", { permanent: true, direction: "top", className: "tag me", offset: [0, -8] });
  SHOPS.forEach((s) => {
    const f = found(l, s.id), full = f === n, cur = s.id === st.shop;
    const m = L.circleMarker(s.ll, { radius: cur ? 10 : 8, color: "#fff", weight: 2.5, fillColor: full ? "#7B5CFF" : "#1F6BFF", fillOpacity: 1 }).addTo(layer)
      .bindTooltip(`<span data-shopid="${s.id}" role="button" aria-label="Choose ${s.n}" style="cursor:pointer;display:block">${s.n.replace("Migros ", "")}<small>${f} of ${n}${full ? " ✓" : ""}</small></span>`, { permanent: true, interactive: true, direction: s.dir, className: "tag" + (cur ? " cur" : ""), offset: s.dir === "left" ? [-9, 0] : s.dir === "right" ? [9, 0] : [0, s.dir === "top" ? -9 : 9] });
    // the dot and its label both select the shop
    L.circleMarker(s.ll, { radius: 20, stroke: false, fillOpacity: 0 }).addTo(layer).on("click", () => pickShop(s.id)); // bigger touch target
    m.on("click", () => pickShop(s.id));
  });
  map.fitBounds(L.latLngBounds([ME, ...SHOPS.map((s) => s.ll)]), { padding: [44, 30] });
}

// ===================== 4 · In the shop =====================
function startShopping() { st.ticked = new Set(); st.started = Date.now(); st.animRoute = true; show("shop"); }

  html += `<div class="go"><button class="btn primary center" id="finish">Finish shopping</button></div>`;
  $("route").innerHTML = html;
  document.querySelectorAll("[data-tick]").forEach((b) => (b.onclick = () => tick(+b.dataset.tick)));
  $("finish").onclick = finish;
  const rp = $("rp"); if (rp && st.animRoute) { st.animRoute = false; const len = rp.getTotalLength(); rp.style.strokeDasharray = len; rp.animate([{ strokeDashoffset: len }, { strokeDashoffset: 0 }], { duration: 1500, easing: "ease-out" }).onfinish = () => (rp.style.strokeDasharray = "4 4"); }
}
function tickHTML(x, sub, free) { const on = st.ticked.has(x.i); return `<button class="tick${on ? " on" : ""}${free ? " free" : ""}" data-tick="${x.i}" data-w="${esc(x.r.word)}" aria-pressed="${on}"><span class="c">${check}</span><div class="tx"><b>${esc(x.r.word)}</b><small>${sub}</small></div></button>`; }
function tick(i) { st.ticked.has(i) ? st.ticked.delete(i) : st.ticked.add(i); const y = $("shop").scrollTop; renderShop(); $("shop").scrollTop = y; if (st.ticked.size === shopItems().length) setTimeout(finish, 800); }
$("endBtn").onclick = () => finish();
function finish() { if ($("done").classList.contains("on") || !$("shop").classList.contains("on")) return; curList().shopped = true; show("done"); }

// ===================== 5 · Shop done =====================
function renderDone() {
  const l = curList(), items = shopItems();
  const got = items.filter((x, i) => x.r.state === "ready" && st.ticked.has(i));
  const b = got.length ? Math.round(got.reduce((a, x) => a + score(x.r.pick), 0) / got.length) : 0;
  const spent = got.reduce((a, x) => a + x.r.pick.pr, 0);
  const stops = new Set(got.map((x) => x.sect)).size;
  $("doneWhen").textContent = `${l.t} · ${shop().n} · today at ${new Date().toTimeString().slice(0, 5)}`;
  $("bigRing").innerHTML = sring(b, 160);
  $("gain").textContent = got.length ? (b >= USUAL ? `+${b - USUAL} points vs. your usual basket` : `${b - USUAL} points vs. your usual basket`) : "Nothing ticked yet";
  $("three").innerHTML = `<div><b>${got.length} of ${items.length}</b><small>verified</small></div><div><b>${chf(spent)}</b><small>on Point picks</small></div><div><b>${stops} stops</b><small>one loop</small></div>`;
  $("doneRows").innerHTML = items.map(({ r }, i) => {
    const ok = st.ticked.has(i);
    return r.state === "ready"
      ? `<div class="drow"><span class="ok${ok ? "" : " grey"}">${ok ? "✓" : "–"}</span><div class="tx">${esc(r.word)}<small>${esc(r.pick.b)} · ${esc(r.pick.n)}</small></div><span class="badge"><i class="ring"></i>${score(r.pick)}</span></div>`
      : `<div class="drow"><span class="ok grey">${ok ? "✓" : "–"}</span><div class="tx">${esc(r.word)}</div><span class="yc">your choice</span></div>`;
  }).join("");
  setTimeout(() => fillRing($("bigRing"), 1400), 250);
}
$("closeDone").onclick = () => { hist.length = 1; show("lists", false); };
$("again").onclick = () => {
  const l = curList();
  st.lists.unshift({ id: "n" + Date.now(), t: l.t, w: [...words(l)], when: "Next week" });
  hist.length = 1; show("lists", false);
};

// ===================== Demo =====================
// D (or "Play demo"): plays by itself, about 70 s.
// → / PageDown / N (or a presentation clicker): one step at a time, at the presenter's pace.
const PACE = 1.0; // higher = slower
const sleep = (ms) => new Promise((r) => setTimeout(r, ms * PACE));
const tapEl = document.createElement("div"); tapEl.className = "tap"; document.body.appendChild(tapEl);
const outro = document.createElement("div"); outro.className = "outro"; outro.innerHTML = `<div><span class="wm">P<i></i>int</span><p>Right to the point.</p></div>`; document.body.appendChild(outro);
async function tap(el, hold = 700) {
  if (!el) throw new Error("demo: element missing");
  el.scrollIntoView({ block: "nearest", behavior: "smooth" }); await sleep(400);
  const r = el.getBoundingClientRect();
  tapEl.style.left = r.left + r.width / 2 + "px"; tapEl.style.top = r.top + r.height / 2 + "px"; tapEl.style.opacity = 1;
  await sleep(hold); tapEl.classList.remove("down"); void tapEl.offsetWidth; tapEl.classList.add("down");
  await sleep(240); if (el.tagName === "INPUT") el.focus(); else el.click(); await sleep(120); tapEl.style.opacity = 0;
}
async function type(el, text, per) { el.focus(); for (const c of text) { el.value += c; el.dispatchEvent(new Event("input")); await sleep(per); } }
const enter = (el) => el.dispatchEvent(new KeyboardEvent("keydown", { key: "Enter", bubbles: true }));
const lastLine = () => [...document.querySelectorAll("#lines input")].pop();
const q = (sel) => document.querySelector(sel);
function resetDemo() {
  closeSheets(); outro.classList.remove("on"); st.shop = "nm"; st.pick = {}; $("lq").value = "";
  st.lists = st.lists.filter((l) => l.id === "f" || l.id === "l"); st.lists.forEach((l) => l.id === "f" && (l.shopped = false));
  hist.length = 1; show("lists", false);
}
// Each step ends on a screen worth talking about. The pause after it is the auto-play dwell.
const STEPS = [
  { t: "Write the list, as in Notes", dwell: 1800, run: async () => {
    await tap($("compose"));
    await sleep(450); await type($("titleIn"), "Weekly shop", 80); await sleep(250); enter($("titleIn")); await sleep(300);
    for (const w of ["pasta", "oranges", "apples", "milk", "coffee", "olive oil"]) { await type(lastLine(), w, 105); await sleep(260); if (w !== "olive oil") enter(lastLine()); }
  } },
  { t: "Done: one answer under every word", dwell: 3800, run: async () => { await tap($("modeBtn")); } },
  { t: "Tap pasta: product, score, place in the shop", dwell: 4000, run: async () => { await tap(q('.ihead[data-i="0"]')); } },
  { t: "Other pastas, ranked by Km 0: pick the Swiss one", dwell: 2600, run: async () => {
    await tap(q("[data-others]")); await sleep(1600);
    await tap(q('[data-goal="transport"]')); await sleep(2400);
    await tap(q('.opt[data-n="Tagliatelle, Swiss spelt"]')); // Point recommends, you decide; the sheet closes itself
  } },
  { t: "The proof, honest about your choice", dwell: 2800, run: async () => {
    await tap(q("[data-proof]")); await sleep(3800);
    $("proof").scrollTo({ top: 900, behavior: "smooth" }); await sleep(600);
  } },
  { t: "Olive oil: nothing verified here", dwell: 2600, run: async () => {
    await tap(q("#proof [data-close]"), 450); await sleep(600);
    await tap(q('.ihead[data-i="5"]'));
  } },
  { t: "Shops nearby that have it", dwell: 4400, run: async () => { await tap(q("[data-where]")); } },
  { t: "In the shop, the list becomes the route", dwell: 3000, run: async () => {
    await tap(q("#shops [data-back]"), 450); await sleep(800);
    await tap($("startBtn"));
  } },
  { t: "Tick off, like a checklist", dwell: 6000, run: async () => {
    for (const w of ["oranges", "apples", "milk", "coffee", "pasta", "olive oil"]) { await tap(q(`[data-w="${w}"]`), 330); await sleep(320); }
    await sleep(1000); // "Shop done" opens by itself after the last tick
  } },
  { t: "Right to the point.", dwell: 3000, run: async () => { outro.classList.add("on"); } },
];
let stepIdx = 0;
function report(i) { try { parent.postMessage({ point: "step", i, n: STEPS.length, t: i > 0 ? STEPS[i - 1].t : "" }, "*"); } catch (e) {} }
async function demo() {
  if (playing) return; playing = true; const t0 = Date.now();
  try {
    resetDemo(); stepIdx = 0; report(0); await sleep(1000);
    for (const [i, s] of STEPS.entries()) { await s.run(); report(i + 1); await sleep(s.dwell); }
    console.log("[Point] demo took " + ((Date.now() - t0) / 1000).toFixed(1) + " s");
  } catch (err) { console.warn("[Point]", err); }
  finally { outro.classList.remove("on"); playing = false; queued = false; stepIdx = 0; report(0); }
}
let queued = false;
async function step() {
  if (playing) { queued = true; return; } // one early press is kept, not lost
  playing = true;
  try {
    if (stepIdx === 0) { resetDemo(); await sleep(400); }
    await STEPS[stepIdx].run(); stepIdx++; report(stepIdx);
    if (stepIdx === STEPS.length) { await sleep(STEPS[stepIdx - 1].dwell); outro.classList.remove("on"); stepIdx = 0; report(0); }
  } catch (err) { console.warn("[Point]", err); stepIdx = 0; report(0); }
  finally { playing = false; if (queued) { queued = false; setTimeout(step, 300); } }
}
addEventListener("keydown", (e) => {
  if (e.key === "Escape") closeSheets();
  const typing = document.activeElement && document.activeElement.tagName === "INPUT";
  const stepKey = e.key === "ArrowRight" || e.key === "PageDown" || ((e.key === "n" || e.key === "N") && !typing);
  if (stepKey && (!typing || stepIdx > 0 || playing)) { e.preventDefault(); step(); }
  if ((e.key === "d" || e.key === "D") && !typing) demo();
});
addEventListener("message", (e) => { if (e.data === "demo") demo(); if (e.data === "step") step(); });

// ===================== Start =====================
setShopNames(); renderLists();
(function () {
  const h = location.hash.slice(1); if (!h) return;
  if (h === "demo") { setTimeout(demo, 800); return; }
  if (!["list", "write", "card", "others", "proof", "shops", "shop", "done"].includes(h)) return;
  openList("w", h === "write" ? "write" : "done");
  if (["card", "others", "proof"].includes(h)) { st.open = 0; renderNote(); }
  if (h === "others") openOthers("pasta");
  if (h === "proof") openProof("pasta");
  if (h === "shops") show("shops");
  if (h === "shop") startShopping();
  if (h === "done") { startShopping(); words(curList()).forEach((w, i) => st.ticked.add(i)); finish(); }
})();
</script>
