<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Point App</title>
<meta name="description" content="Point app prototype: pick a goal, write your list, find the most sustainable product and where it is in the shop.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root { --bg: #03072B; --bg2: #0A1240; --fg: #FFFFFF; --dim: rgba(255,255,255,.55); --line: rgba(255,255,255,.75); --green: #3CCB6E; --blue: #4C8DFF; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--fg); font: 300 16px/1.4 "Jost", "Century Gothic", Futura, sans-serif; overflow: hidden; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  .screen { position: absolute; inset: 0; padding: 54px 26px 28px; overflow-y: auto; display: none; background: radial-gradient(ellipse at 50% 28%, #0E1A5A 0%, var(--bg) 62%); }
  .screen.on { display: block; animation: in .25s ease; }
  @keyframes in { from { opacity: 0; transform: translateX(14px); } to { opacity: 1; transform: none; } }
  .bar { display: flex; justify-content: space-between; align-items: center; height: 30px; }
  .icons { display: flex; gap: 16px; align-items: center; }
  .icon { width: 22px; height: 22px; display: grid; place-items: center; }
  .icon svg { width: 20px; height: 20px; stroke: #fff; fill: none; stroke-width: 1.4; }
  .avatar { width: 26px; height: 26px; border-radius: 50%; border: 1px solid #fff; display: grid; place-items: center; font-size: 11px; font-weight: 400; }
  .caps { text-transform: uppercase; letter-spacing: .22em; }
  .right { text-align: right; }
  .slash { height: 1px; background: var(--line); transform: rotate(-2.2deg); margin: 22px -6px; transform-origin: center; }
  .plus { text-align: right; font-size: 26px; line-height: 1; margin-top: 8px; }

  /* home */
  .logo { display: grid; place-items: center; height: 250px; }
  .logo .ring { width: 150px; height: 150px; border-radius: 50%; background: conic-gradient(from 90deg, #6E5BFF, #4E73FF, #1F6BFF, #3D8BFF, #8FD8FF, #7C7BFF, #6E5BFF); -webkit-mask: radial-gradient(circle, transparent 54%, #000 56%); mask: radial-gradient(circle, transparent 54%, #000 56%); filter: drop-shadow(0 0 18px rgba(110,91,255,.7)); }
  .word { text-align: center; font-size: 15px; letter-spacing: .5em; margin: -6px 0 6px; padding-left: .5em; }
  .goal { display: block; width: 100%; text-align: right; padding: 4px 0; }
  .goal h2 { font-weight: 300; font-size: 26px; line-height: 1.15; margin: 0; letter-spacing: .2em; text-transform: uppercase; }
  .meter { height: 10px; border: 1px solid #fff; border-radius: 6px; margin: 16px 0 0 10px; overflow: hidden; }
  .meter i { display: block; height: 100%; background: #fff; border-radius: 6px; }
  .meter-l { display: flex; justify-content: space-between; font-size: 11px; color: var(--dim); margin-top: 5px; letter-spacing: .12em; text-transform: uppercase; }

  /* list */
  .h1 { font-size: 26px; letter-spacing: .22em; text-transform: uppercase; text-align: right; line-height: 1.2; margin-top: 26px; }
  .h2 { font-size: 20px; letter-spacing: .22em; text-transform: uppercase; text-align: right; line-height: 1.25; }
  .addrow { display: flex; align-items: center; gap: 10px; margin: 18px 0 8px; }
  .addrow input { flex: 1; min-width: 0; background: transparent; border: 0; border-bottom: 1px solid var(--dim); color: #fff; font: inherit; padding: 6px 0; text-align: right; outline: none; }
  .addrow input::placeholder { color: var(--dim); }
  .cat { text-align: right; margin-top: 14px; }
  .cat > button { font-size: 19px; font-weight: 400; display: block; width: 100%; text-align: right; text-transform: capitalize; }
  .cat .opts { display: none; margin-top: 6px; }
  .cat.open .opts { display: block; }
  .opt { display: flex; justify-content: flex-end; align-items: center; gap: 8px; width: 100%; padding: 3px 0; font-size: 16px; color: var(--dim); }
  .opt.pick { color: #fff; }
  .opt .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 8px var(--green); }
  .opt small { font-size: 12px; min-width: 30px; text-align: right; color: var(--dim); }
  .opt.unv { opacity: .45; font-style: italic; }
  .rm { font-size: 12px; color: var(--dim); letter-spacing: .15em; margin-top: 4px; }

  /* product */
  .pimg { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; display: block; margin: 18px 0 0 auto; border: 1px solid rgba(255,255,255,.4); }
  .pname { font-size: 24px; font-weight: 400; text-align: right; margin-top: 18px; }
  .porigin { color: var(--dim); text-align: right; font-size: 14px; }
  .pscore { display: flex; justify-content: flex-end; align-items: baseline; gap: 10px; margin-top: 16px; }
  .pscore b { font-weight: 300; font-size: 52px; line-height: 1; }
  .pscore span { color: var(--dim); font-size: 12px; letter-spacing: .18em; text-transform: uppercase; }
  .dimrow { display: grid; grid-template-columns: 1fr 120px 28px; gap: 10px; align-items: center; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); margin: 9px 0; }
  .dimrow.hi { color: #fff; }
  .thin { height: 4px; border: 1px solid rgba(255,255,255,.6); border-radius: 3px; overflow: hidden; }
  .thin i { display: block; height: 100%; background: #fff; }
  .dimrow b { font-weight: 400; color: #fff; text-align: right; }
  .proof { display: flex; justify-content: flex-end; align-items: center; gap: 10px; font-size: 13px; color: var(--green); margin-top: 14px; }
  .proof button { border: 1px solid var(--green); border-radius: 14px; padding: 2px 12px; font-size: 12px; letter-spacing: .14em; color: var(--green); }
  .actions { display: grid; gap: 10px; margin-top: 22px; }
  .act { border: 1px solid #fff; border-radius: 22px; padding: 10px 0; text-align: center; font-size: 13px; letter-spacing: .24em; text-transform: uppercase; }
  .act.solid { background: #fff; color: var(--bg); font-weight: 500; }
  .note { font-size: 12px; color: var(--dim); text-align: right; margin-top: 10px; }

  /* map */
  #map { height: 330px; margin: 16px -26px 0; background: var(--bg2); }
  .leaflet-tile-pane { filter: invert(1) hue-rotate(195deg) brightness(.85) saturate(.5) contrast(.95); }
  .leaflet-container { font: 300 13px "Jost", sans-serif; background: var(--bg2); }
  .leaflet-control-attribution { background: rgba(3,7,43,.7) !important; color: rgba(255,255,255,.5) !important; font-size: 9px !important; }
  .leaflet-control-attribution a { color: rgba(255,255,255,.7) !important; }
  .pin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid #fff; background: var(--bg); }
  .pin.ok { background: var(--green); box-shadow: 0 0 10px var(--green); }
  .pin.me { background: var(--blue); box-shadow: 0 0 0 6px rgba(76,141,255,.25); }
  .shop { display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,.15); text-align: left; }
  .shop b { font-weight: 400; display: block; }
  .shop span { font-size: 12px; color: var(--dim); }
  .shop em { font-style: normal; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; }
  .shop em.ok { color: var(--green); }
  .shop em.no { color: var(--dim); }

  /* floor plan */
  .plan { margin: 18px 0 0; }
  .plan svg { width: 100%; height: auto; display: block; }
  .here { font-size: 22px; letter-spacing: .2em; text-transform: uppercase; text-align: right; margin-top: 16px; }
  @keyframes pulse { 0% { r: 6; opacity: 1; } 100% { r: 20; opacity: 0; } }
  .pulse { animation: pulse 1.4s ease-out infinite; }

  /* profile */
  .score-box { margin: 10px auto 0; width: 150px; background: #fff; color: var(--bg); border-radius: 8px; display: flex; align-items: baseline; gap: 14px; padding: 6px 14px; }
  .score-box small { font-size: 12px; letter-spacing: .1em; }
  .score-box b { font-weight: 400; font-size: 28px; }
  .deed { display: flex; align-items: center; gap: 12px; font-size: 13px; letter-spacing: .1em; text-transform: uppercase; margin: 12px 0; }
  .deed i { width: 18px; height: 18px; border-radius: 50%; background: #fff; color: var(--bg); font-style: normal; font-size: 11px; display: grid; place-items: center; font-weight: 500; }
</style>
<script>if (/embed/.test(location.search)) document.documentElement.classList.add("embed");</script>
</head>
<body>

<!-- HOME -->
<section class="screen on" id="home">
  <div class="bar">
    <span></span>
    <div class="icons">
      <button class="icon" data-go="map" aria-label="Shops nearby"><svg viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21Z"/><circle cx="12" cy="9.5" r="2.5"/></svg></button>
      <button class="avatar" data-go="profile" aria-label="Profile">P</button>
    </div>
  </div>
  <div class="logo"><div class="ring"></div></div>
  <div class="word">POINT</div>
  <div class="plus">+</div>
  <div class="slash"></div>
  <div id="goals"></div>
</section>

<!-- LIST -->
<section class="screen" id="list">
  <div class="bar"><button class="icon" data-back aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><span></span></div>
  <div class="h1" id="goalTitle"></div>
  <div class="slash"></div>
  <div class="h2">Products<br>list</div>
  <div class="addrow">
    <svg viewBox="0 0 24 24" width="18" height="18" stroke="#fff" fill="none" stroke-width="1.4"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5"/></svg>
    <input id="add" placeholder="add: coffee, apples" list="cats" autocomplete="off" aria-label="Add an item">
    <datalist id="cats"></datalist>
  </div>
  <div id="cats-list"></div>
  <p class="note" style="margin-top:28px">Tap an item to see the shelf. ● = Point’s pick.</p>
</section>

<!-- PRODUCT -->
<section class="screen" id="product">
  <div class="bar"><button class="icon" data-back aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><span class="caps" style="font-size:11px;color:var(--dim)" id="pGoal"></span></div>
  <img class="pimg" id="pImg" alt="">
  <div class="pname" id="pName"></div>
  <div class="porigin" id="pOrigin"></div>
  <div class="pscore"><span id="pScoreL"></span><b id="pScore"></b></div>
  <div class="slash"></div>
  <div id="pDims"></div>
  <div class="proof"><span id="pProof"></span><button id="verify">VERIFY</button></div>
  <div class="actions">
    <button class="act solid" data-go="floor">Find in this shop</button>
    <button class="act" data-go="map">Where to buy</button>
  </div>
</section>

<!-- MAP -->
<section class="screen" id="map-s">
  <div class="bar"><button class="icon" data-back aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><span class="caps" style="font-size:11px;color:var(--dim)" id="mapFor"></span></div>
  <div class="h2" style="margin-top:14px">Shops<br>near you</div>
  <div id="map"></div>
  <div id="shops"></div>
</section>

<!-- FLOOR PLAN -->
<section class="screen" id="floor">
  <div class="bar"><button class="icon" data-back aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><span class="caps" style="font-size:11px;color:var(--dim)" id="floorShop"></span></div>
  <div class="h2" style="margin-top:14px">In the<br>shop</div>
  <div class="plan" id="plan"></div>
  <div class="here" id="aisle"></div>
  <p class="note" id="shelf"></p>
</section>

<!-- PROFILE -->
<section class="screen" id="profile">
  <div class="bar"><button class="icon" data-back aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><span></span></div>
  <div class="score-box"><small>POINTS</small><b>9.7</b></div>
  <div class="slash"></div>
  <div style="text-align:center;letter-spacing:.14em;margin-top:18px">YOUR PROFILE<br><b style="font-weight:500">GUEST</b></div>
  <div style="margin:20px 0 4px;font-size:12px;text-align:right">8.2</div>
  <div class="meter" style="margin:0"><i style="width:82%"></i></div>
  <div style="text-align:center;font-size:12px;letter-spacing:.14em;margin-top:8px">THIS MONTH</div>
  <div style="margin-top:28px;font-size:13px;letter-spacing:.14em">YOUR DEEDS:</div>
  <div class="deed"><i>✓</i>Chose Point’s pick 14 times</div>
  <div class="deed"><i>✓</i>Saved 3.1 kg CO₂</div>
  <div class="deed"><i>✓</i>Avoided 22 plastic trays</div>
  <div class="deed"><i>✓</i>Invited a friend</div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const GOALS = [
  { k: "plastic", t: "Less<br>plastic", p: 78 },
  { k: "co2", t: "Less<br>CO₂", p: 55 },
  { k: "water", t: "Less<br>water", p: 40 },
  { k: "km0", t: "Km 0", p: 63 },
  { k: "all", t: "All<br>together", p: 61 },
];
const DIMS = { co2: "CO₂", water: "Water", land: "Land", plastic: "Plastic", energy: "Energy", km0: "Km 0" };

// Shops in Ticino (illustrative names and positions).
const SHOPS = [
  { id: "lc", n: "Supermarket Lugano Centro", a: "Via Pretorio, Lugano", ll: [46.0056, 8.9497] },
  { id: "ca", n: "Supermarket Cassarate", a: "Viale Castagnola, Lugano", ll: [46.0058, 8.9680] },
  { id: "pa", n: "Supermarket Paradiso", a: "Riva Paradiso, Paradiso", ll: [45.9895, 8.9468] },
  { id: "ma", n: "Supermarket Massagno", a: "Via San Gottardo, Massagno", ll: [46.0128, 8.9443] },
];
const ME = [46.0036, 8.9514];

// aisle: 1-6, shelf: text. shops: where it is stocked. Illustrative data.
const DATA = {
  pasta: { aisle: 3, sec: "Pasta & rice", items: [
    { n: "Spaghetti", img: "pasta-a.jpg", d: "Durum wheat, Italy · 500 g · paper box", pr: 2.20, all: 86.5, s: { co2: 84, water: 79, land: 82, plastic: 95, energy: 86.5, km0: 72 }, shops: ["lc", "ca", "ma"], shelf: "Shelf B, eye level" },
    { n: "Tagliatelle", img: "pasta-c.jpg", d: "Swiss spelt · 250 g · plastic tray", pr: 3.90, all: 81.8, s: { co2: 80, water: 85, land: 70, plastic: 58, energy: 81.8, km0: 94 }, shops: ["lc", "pa"], shelf: "Shelf A, top" },
    { n: "Penne", img: "pasta-b.png", d: "Durum wheat, Canada · 500 g · plastic bag", pr: 1.60, all: 77.4, s: { co2: 76, water: 81, land: 78, plastic: 55, energy: 77.4, km0: 48 }, shops: ["lc", "ca", "pa", "ma"], shelf: "Shelf C, bottom" },
    { n: "Egg pasta", img: null, d: "Origin not disclosed", pr: 2.80, all: null },
  ]},
  oranges: { aisle: 1, sec: "Fruit & vegetables", items: [
    { n: "Blood oranges", img: "oranges-a.jpg", d: "Sicily, Italy · 1 kg · loose", pr: 3.95, all: 79.6, s: { co2: 80, water: 66, land: 82, plastic: 96, energy: 84, km0: 74 }, shops: ["lc", "ma"], shelf: "Crate 4, by the entrance" },
    { n: "Oranges", img: "oranges-b.jpg", d: "Valencia, Spain · 2 kg · net", pr: 4.50, all: 71.2, s: { co2: 74, water: 52, land: 80, plastic: 70, energy: 79, km0: 58 }, shops: ["lc", "ca", "pa", "ma"], shelf: "Crate 5" },
    { n: "Navel oranges", img: "oranges-c.jpg", d: "South Africa · 1.5 kg · plastic bag", pr: 3.20, all: 55.8, s: { co2: 49, water: 58, land: 78, plastic: 55, energy: 62, km0: 10 }, shops: ["ca", "pa"], shelf: "Crate 6" },
  ]},
  tomatoes: { aisle: 1, sec: "Fruit & vegetables", items: [
    { n: "Tomatoes", img: "tomatoes-a.jpg", d: "Field-grown, Ticino · 1 kg · loose", pr: 4.20, all: 88.2, s: { co2: 91, water: 74, land: 85, plastic: 98, energy: 90, km0: 97 }, shops: ["lc", "pa", "ma"], shelf: "Crate 1, local produce" },
    { n: "Roma tomatoes", img: "tomatoes-c.jpg", d: "Spain · plastic tray", pr: 2.95, all: 66.7, s: { co2: 70, water: 39, land: 76, plastic: 42, energy: 78, km0: 40 }, shops: ["lc", "ca", "pa", "ma"], shelf: "Crate 2" },
    { n: "Cherry tomatoes", img: "tomatoes-b.jpg", d: "Heated greenhouse, Netherlands · tray", pr: 3.50, all: 61.0, s: { co2: 52, water: 88, land: 92, plastic: 40, energy: 41, km0: 45 }, shops: ["ca", "ma"], shelf: "Crate 3" },
    { n: "San Marzano", img: "tomatoes-d.jpg", d: "Origin not disclosed", pr: 3.80, all: null },
  ]},
  milk: { aisle: 5, sec: "Dairy", items: [
    { n: "Oat drink", img: "milk-b.jpg", d: "Sweden · 1 l · carton", pr: 2.95, all: 84.9, s: { co2: 90, water: 89, land: 87, plastic: 76, energy: 81, km0: 62 }, shops: ["lc", "ca", "ma"], shelf: "Fridge 2, middle" },
    { n: "Whole milk", img: "milk-a.jpg", d: "Emmental, Switzerland · 1 l · glass", pr: 1.65, all: 72.3, s: { co2: 61, water: 66, land: 58, plastic: 90, energy: 74, km0: 92 }, shops: ["lc", "ca", "pa", "ma"], shelf: "Fridge 1, top" },
  ]},
  coffee: { aisle: 4, sec: "Coffee & breakfast", items: [
    { n: "Coffee beans", img: "coffee-a.jpg", d: "Peru, shade-grown · paper bag", pr: 8.90, all: 69.8, s: { co2: 64, water: 61, land: 79, plastic: 70, energy: 72, km0: 30 }, shops: ["lc", "ma"], shelf: "Shelf A, eye level" },
    { n: "Instant coffee", img: "coffee-b.jpg", d: "Brazil · glass jar", pr: 6.50, all: 58.2, s: { co2: 52, water: 55, land: 60, plastic: 68, energy: 44, km0: 28 }, shops: ["lc", "ca", "pa", "ma"], shelf: "Shelf C" },
    { n: "Ground coffee", img: "coffee-c.jpg", d: "Origin not disclosed", pr: 5.95, all: null },
  ]},
  apples: { aisle: 1, sec: "Fruit & vegetables", items: [
    { n: "Gala apples", img: "apples-a.jpg", d: "Thurgau, Switzerland · 1 kg · loose", pr: 3.40, all: 90.4, s: { co2: 92, water: 86, land: 88, plastic: 99, energy: 87, km0: 96 }, shops: ["lc", "ca", "pa", "ma"], shelf: "Crate 7" },
    { n: "Pink Lady apples", img: "apples-b.jpg", d: "New Zealand · plastic bag", pr: 4.95, all: 64.1, s: { co2: 55, water: 80, land: 84, plastic: 60, energy: 70, km0: 12 }, shops: ["ca", "pa"], shelf: "Crate 8" },
  ]},
};

const st = { goal: "plastic", list: ["pasta", "oranges", "tomatoes", "milk"], cat: null, prod: null, shop: "lc", openCat: "pasta" };
const hist = ["home"];
const $ = (id) => document.getElementById(id);
const sc = (p) => (p.all === null ? null : st.goal === "all" ? p.all : p.s[st.goal]);
const goalName = () => GOALS.find((g) => g.k === st.goal).t.replace("<br>", " ");
const ranked = (k) => DATA[k].items.slice().sort((a, b) => (sc(b) ?? -1) - (sc(a) ?? -1));
function hash(s) { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h.toString(16).padStart(8, "0"); }

function show(id, push = true) {
  document.querySelectorAll(".screen").forEach((s) => s.classList.remove("on"));
  const el = $(id === "map" ? "map-s" : id);
  el.classList.add("on"); el.scrollTop = 0;
  if (push) hist.push(id);
  ({ list: renderList, product: renderProduct, map: renderMap, floor: renderFloor })[id]?.();
}
function back() { if (hist.length > 1) { hist.pop(); show(hist[hist.length - 1], false); } }

$("goals").innerHTML = GOALS.map((g, i) => `
  <button class="goal" data-goal="${g.k}"><h2>${g.t}</h2>
    <div class="meter"><i style="width:${g.p}%"></i></div>
    <div class="meter-l"><span>your month</span><span>${g.p}%</span></div></button>${i < GOALS.length - 1 ? '<div class="slash"></div>' : ""}`).join("");
$("cats").innerHTML = Object.keys(DATA).map((k) => `<option value="${k}">`).join("");

function renderList() {
  $("goalTitle").innerHTML = GOALS.find((g) => g.k === st.goal).t;
  $("cats-list").innerHTML = st.list.map((k) => {
    if (!DATA[k]) return `<div class="cat"><button>${k}</button><div class="rm">NOT IN THIS SHOP YET</div></div>`;
    const r = ranked(k);
    return `<div class="cat ${st.openCat === k ? "open" : ""}"><button data-cat="${k}">${k}</button><div class="opts">${r.map((p, i) => {
      const v = sc(p), unv = v === null, pick = i === 0 && !unv;
      return `<button class="opt ${pick ? "pick" : ""} ${unv ? "unv" : ""}" data-prod="${k}|${p.n}">${pick ? '<span class="dot"></span>' : ""}${p.n}<small>${unv ? "n/a" : Math.round(v)}</small></button>`;
    }).join("")}<button class="rm" data-rm="${k}">REMOVE</button></div></div>`;
  }).join("");
}

function renderProduct() {
  const p = st.prod, v = sc(p), unv = v === null;
  $("pGoal").textContent = goalName();
  $("pImg").src = p.img ? "img/" + p.img : ""; $("pImg").style.display = p.img ? "block" : "none"; $("pImg").alt = p.n;
  $("pName").textContent = p.n;
  $("pOrigin").textContent = `${p.d} · CHF ${p.pr.toFixed(2)}`;
  $("pScore").textContent = unv ? "–" : v.toFixed(1);
  $("pScoreL").textContent = unv ? "no verified data" : st.goal === "all" ? "overall score" : goalName() + " score";
  $("pDims").innerHTML = unv ? `<p class="note">The producer has not shared verified data. Point shows the product, but never recommends it.</p>` :
    Object.entries(DIMS).map(([k, l]) => `<div class="dimrow ${k === st.goal ? "hi" : ""}"><span>${l}</span><div class="thin"><i style="width:${p.s[k]}%"></i></div><b>${Math.round(p.s[k])}</b></div>`).join("");
  $("pProof").textContent = unv ? "" : `✓ proof 0x${hash(p.n)}…`;
  $("verify").style.display = unv ? "none" : ""; $("verify").textContent = "VERIFY"; $("verify").disabled = false;
}

let map, layer;
function renderMap() {
  const p = st.prod;
  $("mapFor").textContent = p ? p.n : "All shops";
  if (!map) {
    map = L.map("map", { zoomControl: false, attributionControl: true }).setView([46.0035, 8.953], 14);
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>' }).addTo(map);
    layer = L.layerGroup().addTo(map);
  }
  setTimeout(() => { map.invalidateSize(); map.fitBounds(L.latLngBounds([ME, ...SHOPS.map((x) => x.ll)]), { padding: [28, 28] }); }, 60);
  layer.clearLayers();
  L.marker(ME, { icon: L.divIcon({ className: "", html: '<div class="pin me"></div>', iconSize: [14, 14] }) }).addTo(layer).bindTooltip("You", { direction: "top" });
  const dist = (ll) => (map.distance(ME, ll) / 1000).toFixed(1);
  const rows = SHOPS.map((s) => ({ s, ok: !p || (p.shops || []).includes(s.id), km: dist(s.ll) })).sort((a, b) => (b.ok - a.ok) || (a.km - b.km));
  rows.forEach(({ s, ok }) => L.marker(s.ll, { icon: L.divIcon({ className: "", html: `<div class="pin ${ok ? "ok" : ""}"></div>`, iconSize: [14, 14] }) }).addTo(layer).bindTooltip(s.n, { direction: "top" }).on("click", () => { st.shop = s.id; show("floor"); }));
  $("shops").innerHTML = rows.map(({ s, ok, km }) => `<button class="shop" data-shop="${s.id}"><div><b>${s.n}</b><span>${s.a} · ${km} km</span></div><em class="${ok ? "ok" : "no"}">${p ? (ok ? "in stock" : "not here") : "open"}</em></button>`).join("");
}

function renderFloor() {
  const shop = SHOPS.find((s) => s.id === st.shop);
  const p = st.prod || DATA.pasta.items[0];
  const cat = Object.values(DATA).find((c) => c.items.includes(p)) || DATA.pasta;
  const inStock = (p.shops || []).includes(shop.id);
  $("floorShop").textContent = shop.n.replace("Supermarket ", "");
  const A = cat.aisle;
  const labels = ["Fruit & veg", "Bakery", "Pasta & rice", "Coffee", "Dairy", "Drinks"];
  const aisles = [1, 2, 3, 4, 5, 6].map((i) => {
    const x = 18 + (i - 1) * 50, on = i === A && inStock;
    return `<rect x="${x}" y="40" width="30" height="150" rx="4" fill="${on ? "#4C8DFF" : "none"}" stroke="${on ? "#4C8DFF" : "rgba(255,255,255,.55)"}" stroke-width="1"/>
      <text x="${x + 15}" y="32" fill="${on ? "#fff" : "rgba(255,255,255,.55)"}" font-size="9" text-anchor="middle" font-family="Jost">${i}</text>
      <text x="${x + 15}" y="115" fill="${on ? "#03072B" : "rgba(255,255,255,.45)"}" font-size="8" text-anchor="middle" font-family="Jost" transform="rotate(-90 ${x + 15} 115)" letter-spacing="1.5">${labels[i - 1].toUpperCase()}</text>`;
  }).join("");
  const px = 18 + (A - 1) * 50 + 15;
  $("plan").innerHTML = `<svg viewBox="0 0 320 260" role="img" aria-label="Floor plan, product in aisle ${A}">
    <rect x="4" y="4" width="312" height="252" rx="10" fill="none" stroke="rgba(255,255,255,.75)" stroke-width="1"/>
    ${aisles}
    <path d="M 40 238 L 40 214 L ${px} 214 L ${px} 196" fill="none" stroke="#fff" stroke-width="1.2" stroke-dasharray="3 4" opacity="${inStock ? 1 : 0}"/>
    <rect x="16" y="240" width="48" height="16" fill="#03072B"/><text x="40" y="252" fill="#fff" font-size="9" text-anchor="middle" font-family="Jost" letter-spacing="2">ENTRANCE</text>
    <circle cx="40" cy="226" r="5" fill="#4C8DFF"/>
    ${inStock ? `<circle cx="${px}" cy="120" r="6" fill="#3CCB6E" class="pulse"/><circle cx="${px}" cy="120" r="5" fill="#3CCB6E"/>` : ""}
  </svg>`;
  $("aisle").innerHTML = inStock ? `Aisle ${A}<br><span style="font-size:14px;letter-spacing:.18em">${cat.sec}</span>` : "Not in<br>this shop";
  $("shelf").textContent = inStock ? `${p.n} · ${p.shelf}` : `Try ${SHOPS.filter((s) => (p.shops || []).includes(s.id)).map((s) => s.n.replace("Supermarket ", "")).join(", ")}.`;
}

function addItem() { const k = $("add").value.trim().toLowerCase(); if (k && !st.list.includes(k)) st.list.push(k); st.openCat = k; $("add").value = ""; renderList(); }
$("add").addEventListener("keydown", (e) => { if (e.key === "Enter") addItem(); });
$("add").addEventListener("change", addItem);

document.addEventListener("click", (e) => {
  const t = e.target.closest("button"); if (!t) return;
  if (t.hasAttribute("data-back")) return back();
  if (t.dataset.goal) { st.goal = t.dataset.goal; return show("list"); }
  if (t.dataset.cat) { st.openCat = st.openCat === t.dataset.cat ? null : t.dataset.cat; return renderList(); }
  if (t.dataset.rm) { st.list = st.list.filter((k) => k !== t.dataset.rm); return renderList(); }
  if (t.dataset.prod) { const [k, n] = t.dataset.prod.split("|"); st.prod = DATA[k].items.find((p) => p.n === n); return show("product"); }
  if (t.dataset.shop) { st.shop = t.dataset.shop; return show("floor"); }
  if (t.dataset.go) { if (t.dataset.go === "map" && hist[hist.length - 1] === "home") st.prod = null; return show(t.dataset.go); }
  if (t.id === "verify") { t.textContent = "CHECKING…"; setTimeout(() => { t.textContent = "✓ VALID"; t.disabled = true; }, 700); }
});
// Deep links for the pitch, e.g. app.html#floor or app.html#product
(function () {
  const h = location.hash.slice(1); if (!h) return;
  st.prod = DATA.pasta.items[0];
  const path = { list: ["list"], product: ["list", "product"], map: ["list", "product", "map"], floor: ["list", "product", "floor"], profile: ["profile"] }[h] || [];
  path.forEach((id) => show(id));
})();
</script>
</body>
